asyncapi: 3.1.0
info:
  title: Payment Hub Processing
  version: 1.3.1
channels:
  ffc-pay-processing:
    address: ffc-pay-processing
    messages:
      subscribe.message:
        $ref: '#/components/messages/PaymentRequest'
  ffc-pay-submit:
    address: ffc-pay-submit
    messages:
      publish.message:
        $ref: '#/components/messages/PaymentRequest'
  ffc-pay-debt-data:
    address: ffc-pay-debt-data
    messages:
      publish.message:
        $ref: '#/components/messages/PaymentRequest'
  ffc-pay-manual-ledger-check:
    address: ffc-pay-manual-ledger-check
    messages:
      subscribe.message:
        $ref: '#/components/messages/ManualLedgerCheck'
  ffc-pay-quality-check:
    address: ffc-pay-quality-check
    messages:
      publish.message:
        $ref: '#/components/messages/ManualLedgerCheck'
  ffc-pay-acknowledgement:
    address: ffc-pay-acknowledgement
    messages:
      subscribe.message:
        $ref: '#/components/messages/Acknowledgement'
  ffc-pay-return:
    address: ffc-pay-return
    messages:
      subscribe.message:
        $ref: '#/components/messages/Return'
  ffc-pay-events:
    address: ffc-pay-events
    messages:
      publish.message:
        $ref: '#/components/messages/Event'
  ffc-pay-return-response:
    address: ffc-pay-return-response
    messages:
      publish.message:
        $ref: '#/components/messages/ReturnResponse'
operations:
  ffc-pay-processing.subscribe:
    action: send
    channel:
      $ref: '#/channels/ffc-pay-processing'
    messages:
      - $ref: '#/channels/ffc-pay-processing/messages/subscribe.message'
  ffc-pay-submit.publish:
    action: receive
    channel:
      $ref: '#/channels/ffc-pay-submit'
    messages:
      - $ref: '#/channels/ffc-pay-submit/messages/publish.message'
  ffc-pay-debt-data.publish:
    action: receive
    channel:
      $ref: '#/channels/ffc-pay-debt-data'
    messages:
      - $ref: '#/channels/ffc-pay-debt-data/messages/publish.message'
  ffc-pay-manual-ledger-check.subscribe:
    action: send
    channel:
      $ref: '#/channels/ffc-pay-manual-ledger-check'
    messages:
      - $ref: '#/channels/ffc-pay-manual-ledger-check/messages/subscribe.message'
  ffc-pay-quality-check.publish:
    action: receive
    channel:
      $ref: '#/channels/ffc-pay-quality-check'
    messages:
      - $ref: '#/channels/ffc-pay-quality-check/messages/publish.message'
  ffc-pay-acknowledgement.subscribe:
    action: send
    channel:
      $ref: '#/channels/ffc-pay-acknowledgement'
    messages:
      - $ref: '#/channels/ffc-pay-acknowledgement/messages/subscribe.message'
  ffc-pay-return.subscribe:
    action: send
    channel:
      $ref: '#/channels/ffc-pay-return'
    messages:
      - $ref: '#/channels/ffc-pay-return/messages/subscribe.message'
  ffc-pay-events.publish:
    action: receive
    channel:
      $ref: '#/channels/ffc-pay-events'
    messages:
      - $ref: '#/channels/ffc-pay-events/messages/publish.message'
  ffc-pay-return-response:
    action: send
    channel:
      $ref: '#/channels/ffc-pay-return-response'
    messages:
      - $ref: '#/channels/ffc-pay-return-response/messages/publish.message'
components:
  messages:
    PaymentRequest:
      description: Payment request transaction
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PaymentRequest'
    ManualLedgerCheck:
      description: Ledger assignment for review
      contentType: application/json
      payload:
        type: object
        properties:
          deltaPaymentRequest:
            $ref: '#/components/schemas/PaymentRequest'
          completedPaymentRequests:
            type: array
            description: >-
              Payment request after both delta calculations and automated ledger
              assignment
            items:
              $ref: '#/components/schemas/PaymentRequest'
    Acknowledgement:
      description: Payment request acknowledgements from Dynamics 365
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Acknowledgement'
    Return:
      description: Payment request settlements from Dynamics 365 AP Ledger
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Return'
    Event:
      name: Payment event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Event'
    ReturnResponse:
      description: Payment request returned to the source system after acknowledgement or settlement
      contentType: application/json
      payload:
        type: object
        required:
          - body
          - type
          - source
          - subject
        properties:
          body:
            $ref: '#/components/schemas/CompletedPaymentRequest'
          type:
            type: string
          source:
            type: string
          subject:
            type: string
      examples:
        - name: acknowledged
          payload:
            body:
              $ref: '#/components/schemas/CompletedPaymentRequest/example'
            type: uk.gov.defra.ffc.pay.payment.acknowledged
            source: ffc-pay-processing
            subject: AHWR
        - name: settled
          payload:
            body:
              $ref: '#/components/schemas/CompletedPaymentRequest/example'
            type: uk.gov.defra.ffc.pay.payment.settled
            source: ffc-pay-processing
            subject: AHWR
  schemas:
    PaymentRequest:
      type: object
      required:
        - sourceSystem
        - frn
        - marketingYear
        - paymentRequestNumber
        - correlationId
        - invoiceNumber
        - agreementNumber
        - currency
        - dueDate
        - value
        - schemeId
        - ledger
        - deliveryBody
        - debtType
        - referenceId
        - invoiceLines
      properties:
        sourceSystem:
          $ref: '#/components/schemas/SourceSystem'
        sbi:
          $ref: '#/components/schemas/Sbi'
        frn:
          $ref: '#/components/schemas/Frn'
        marketingYear:
          $ref: '#/components/schemas/MarketingYear'
        paymentRequestNumber:
          $ref: '#/components/schemas/PaymentRequestNumber'
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        correlationId:
          $ref: '#/components/schemas/CorrelationId'
        invoiceNumber:
          $ref: '#/components/schemas/InvoiceNumber'
        agreementNumber:
          $ref: '#/components/schemas/AgreementNumber'
        contractNumber:
          $ref: '#/components/schemas/ContractNumber'
        currency:
          $ref: '#/components/schemas/Currency'
        schedule:
          $ref: '#/components/schemas/Schedule'
        dueDate:
          $ref: '#/components/schemas/DueDate'
        value:
          $ref: '#/components/schemas/Value'
        schemeId:
          $ref: '#/components/schemas/SchemeId'
        ledger:
          $ref: '#/components/schemas/Ledger'
        deliveryBody:
          $ref: '#/components/schemas/DeliveryBody'
        debtType:
          $ref: '#/components/schemas/DebtType'
        recoveryDate:
          $ref: '#/components/schemas/RecoveryDate'
        originalSettlementDate:
          $ref: '#/components/schemas/OriginalSettlementDate'
        originalInvoiceNumber:
          $ref: '#/components/schemas/InvoiceNumber'
        invoiceCorrectionReference:
          $ref: '#/components/schemas/InvoiceNumber'
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        pillar:
          $ref: '#/components/schemas/Pillar'
        invoiceLines:
          $ref: '#/components/schemas/InvoiceLines'
    InvoiceLines:
      type: array
      description: List of Invoice lines that make up request
      items:
        type: object
        required:
          - description
          - value
          - schemeCode
          - fundCode
          - accountCode
        properties:
          description:
            $ref: '#/components/schemas/Description'
          value:
            $ref: '#/components/schemas/Value'
          schemeCode:
            $ref: '#/components/schemas/SchemeCode'
          fundCode:
            $ref: '#/components/schemas/FundCode'
          accountCode:
            $ref: '#/components/schemas/AccountCode'
          deliveryBody:
            $ref: '#/components/schemas/DeliveryBody'
          agreementNumber:
            $ref: '#/components/schemas/AgreementNumber'
          marketingYear:
            $ref: '#/components/schemas/MarketingYear'
          convergence:
            $ref: '#/components/schemas/Convergence'
          stateAid:
            $ref: '#/components/schemas/StateAid'
    CompletedInvoiceLine:
      type: object
      description: Persisted invoice line record after payment request completion
      required:
        - completedInvoiceLineId
        - completedPaymentRequestId
        - schemeCode
        - accountCode
        - fundCode
        - description
        - value
        - convergence
        - deliveryBody
        - marketingYear
        - stateAid
      example:
        completedInvoiceLineId: 7
        completedPaymentRequestId: 7
        schemeCode: '18005'
        accountCode: SOS210
        fundCode: DOM10
        agreementNumber: null
        description: 'G00 - 2026-03-05: AHWR Poultry'
        value: 120100
        convergence: false
        deliveryBody: RP00
        marketingYear: 2025
        stateAid: false
      properties:
        completedInvoiceLineId:
          type: integer
          format: int32
          example: 7
        completedPaymentRequestId:
          type: integer
          format: int32
          example: 7
        schemeCode:
          type: string
          example: '18005'
        accountCode:
          type: string
          example: SOS210
        fundCode:
          type: string
          example: DOM10
        agreementNumber:
          type: string
          nullable: true
          example: null
        description:
          type: string
          example: 'G00 - 2026-03-05: AHWR Poultry'
        value:
          type: integer
          format: int32
          example: 120100
        convergence:
          type: boolean
          example: false
        deliveryBody:
          type: string
          example: RP00
        marketingYear:
          type: integer
          format: int32
          example: 2025
        stateAid:
          type: boolean
          example: false
    CompletedPaymentRequest:
      type: object
      description: Persisted payment request record after completion and submission
      required:
        - completedPaymentRequestId
        - paymentRequestId
        - schemeId
        - sourceSystem
        - deliveryBody
        - invoiceNumber
        - frn
        - sbi
        - marketingYear
        - agreementNumber
        - contractNumber
        - paymentRequestNumber
        - currency
        - dueDate
        - value
        - submitted
        - acknowledged
        - invalid
        - referenceId
        - correlationId
        - invoiceLines
      example:
        completedPaymentRequestId: 7
        paymentRequestId: 7
        schemeId: 4
        batch: null
        ledger: AP
        sourceSystem: AHWR
        deliveryBody: RP00
        invoiceNumber: 70012345V001
        frn: '2842263042'
        sbi: 106284736
        vendor: null
        trader: null
        marketingYear: 2025
        agreementNumber: '70012345'
        contractNumber: '1'
        paymentRequestNumber: 1
        currency: GBP
        schedule: null
        dueDate: 05/12/2025
        debtType: null
        recoveryDate: null
        originalSettlementDate: null
        originalInvoiceNumber: null
        invoiceCorrectionReference: null
        value: 1600200
        submitted: '2026-07-24T10:10:55.669Z'
        acknowledged: '2026-01-27T11:40:15.792Z'
        lastSettlement: null
        settledValue: null
        invalid: false
        referenceId: 31256908-d4a9-4402-b5b0-05285c7a061a
        correlationId: debb132a-7c9c-4dde-9ae-68031376fea4
        paymentType: null
        pillar: null
        exchangeRate: null
        eventDate: null
        claimDate: null
        fesCode: null
        annualValue: null
        remmittanceDescription: null
        providesAccountingValues: false
        invoiceLines:
          - completedInvoiceLineId: 7
            completedPaymentRequestId: 7
            schemeCode: '18005'
            accountCode: SOS210
            fundCode: DOM10
            agreementNumber: null
            description: 'G00 - 2026-03-05: AHWR Poultry'
            value: 120100
            convergence: false
            deliveryBody: RP00
            marketingYear: 2025
            stateAid: false
      properties:
        completedPaymentRequestId:
          type: integer
          format: int32
          example: 7
        paymentRequestId:
          type: integer
          format: int32
          example: 7
        schemeId:
          type: integer
          format: int32
          example: 4
        batch:
          type: string
          nullable: true
          example: null
        ledger:
          type: string
          example: AP
        sourceSystem:
          type: string
          example: AHWR
        deliveryBody:
          type: string
          example: RP00
        invoiceNumber:
          type: string
          example: 70012345V001
        frn:
          type: string
          example: '2842263042'
        sbi:
          type: integer
          format: int32
          example: 106284736
        vendor:
          type: string
          nullable: true
          example: null
        trader:
          type: string
          nullable: true
          example: null
        marketingYear:
          type: integer
          format: int32
          example: 2025
        agreementNumber:
          type: string
          example: '70012345'
        contractNumber:
          type: string
          example: '1'
        paymentRequestNumber:
          type: integer
          format: int32
          example: 1
        currency:
          type: string
          example: GBP
        schedule:
          type: string
          nullable: true
          example: null
        dueDate:
          type: string
          example: 05/12/2025
        debtType:
          type: string
          nullable: true
          example: null
        recoveryDate:
          type: string
          nullable: true
          example: null
        originalSettlementDate:
          type: string
          nullable: true
          example: null
        originalInvoiceNumber:
          type: string
          nullable: true
          example: null
        invoiceCorrectionReference:
          type: string
          nullable: true
          example: null
        value:
          type: integer
          format: int32
          example: 1600200
        submitted:
          type: string
          format: date-time
          example: '2026-07-24T10:10:55.669Z'
        acknowledged:
          type: string
          format: date-time
          example: '2026-01-27T11:40:15.792Z'
        lastSettlement:
          type: string
          format: date-time
          nullable: true
          example: null
        settledValue:
          type: integer
          format: int32
          nullable: true
          example: null
        invalid:
          type: boolean
          example: false
        referenceId:
          type: string
          format: uuid
          example: 31256908-d4a9-4402-b5b0-05285c7a061a
        correlationId:
          type: string
          format: uuid
          example: debb132a-7c9c-4dde-9ae-68031376fea4
        paymentType:
          type: integer
          format: int32
          nullable: true
          example: null
        pillar:
          type: string
          nullable: true
          example: null
        exchangeRate:
          type: string
          nullable: true
          example: null
        eventDate:
          type: string
          nullable: true
          example: null
        claimDate:
          type: string
          nullable: true
          example: null
        fesCode:
          type: string
          nullable: true
          example: null
        annualValue:
          type: number
          nullable: true
          example: null
        remmittanceDescription:
          type: string
          nullable: true
          example: null
        providesAccountingValues:
          type: boolean
          example: false
        invoiceLines:
          type: array
          items:
            $ref: '#/components/schemas/CompletedInvoiceLine'
    Acknowledgement:
      type: object
      required:
        - invoiceNumber
        - frn
        - success
        - acknowledged
      properties:
        invoiceNumber:
          $ref: '#/components/schemas/InvoiceNumber'
        frn:
          $ref: '#/components/schemas/Frn'
        success:
          $ref: '#/components/schemas/Success'
        acknowledged:
          $ref: '#/components/schemas/Acknowledged'
        message:
          $ref: '#/components/schemas/Message'
    Return:
      type: object
      required:
        - sourceSystem
        - invoiceNumber
        - frn
        - postedDate
        - currency
        - value
        - reference
        - settled
      properties:
        sourceSystem:
          $ref: '#/components/schemas/SourceSystem'
        invoiceNumber:
          $ref: '#/components/schemas/InvoiceNumber'
        frn:
          $ref: '#/components/schemas/Frn'
        postedDate:
          $ref: '#/components/schemas/PostedDate'
        currency:
          $ref: '#/components/schemas/Currency'
        value:
          $ref: '#/components/schemas/Value'
        reference:
          $ref: '#/components/schemas/Reference'
        settled:
          $ref: '#/components/schemas/Settled'
        detail:
          $ref: '#/components/schemas/Detail'
    Event:
      type: object
      required:
        - specversion
        - type
        - source
        - id
        - time
      properties:
        specversion:
          $ref: '#/components/schemas/Specversion'
        type:
          $ref: '#/components/schemas/Type'
        source:
          $ref: '#/components/schemas/Source'
        id:
          $ref: '#/components/schemas/Id'
        time:
          $ref: '#/components/schemas/Time'
        subject:
          $ref: '#/components/schemas/Subject'
        datacontenttype:
          $ref: '#/components/schemas/Datacontenttype'
        data:
          oneOf:
            - $ref: '#/components/schemas/PaymentData'
            - $ref: '#/components/schemas/BatchData'
            - $ref: '#/components/schemas/HoldData'
            - $ref: '#/components/schemas/WarningData'
    PaymentData:
      type: object
      required:
        - frn
        - schemeId
        - correlationId
        - invoiceNumber
      properties:
        frn:
          $ref: '#/components/schemas/Frn'
        schemeId:
          $ref: '#/components/schemas/SchemeId'
        correlationId:
          $ref: '#/components/schemas/CorrelationId'
        invoiceNumber:
          $ref: '#/components/schemas/InvoiceNumber'
    BatchData:
      type: object
      required:
        - filename
      properties:
        filename:
          $ref: '#/components/schemas/Filename'
    HoldData:
      type: object
      required:
        - frn
        - schemeId
        - holdCategoryId
      schemeId:
        $ref: '#/components/schemas/SchemeId'
      frn:
        $ref: '#/components/schemas/Frn'
      holdCategoryId:
        $ref: '#/components/schemas/HoldCategoryId'
    WarningData:
      type: object
      required:
        - frn
        - schemeId
        - message
      properties:
        message:
          $ref: '#/components/schemas/Message'
    SourceSystem:
      type: string
      description: System identifier request originates from
      example: SFI
    Sbi:
      type: integer
      format: int32
      description: Single Business Identifier
      example: 123456789
    Frn:
      type: integer
      format: int64
      description: Firm Reference Number
      example: 1234567890
    MarketingYear:
      type: integer
      format: int32
      description: Scheme year of Payment Request
      example: 2023
    PaymentRequestNumber:
      type: integer
      format: int32
      description: >-
        Version of payment request starting with 1, anything greater than 1 is
        an adjustment
      example: 1
    PaymentType:
      type: number
      description: Defines type of payment request either Balance or Advance
      minimum: 1
      maximum: 3
      example: 1
    CorrelationId:
      type: string
      format: uuid
      description: Correlation ID for payment request chain.
      example: 123e4567-e89b-12d3-a456-426655440000
    InvoiceNumber:
      type: string
      description: Invoice number.
      example: S1234567S1234567V001
    AgreementNumber:
      type: string
      description: Unique reference number for agreement/application
      example: SIP0000000000001
    ContractNumber:
      type: string
      description: Contract/Claim Id
      example: C1234567
    Currency:
      type: string
      description: Currency of values in request
      enum:
        - GBP
        - EUR
      example: GBP
    Schedule:
      type: string
      description: >-
        Payment frequency instruction for D365.  These codes are pre-configured
        in D365 and have an underlying schedule coded to them.
      enum:
        - Q4
        - T4
        - M12
        - Y2
        - T2
      example: Q4
    DueDate:
      type: string
      description: >-
        Earliest date payment should be made or scheduled from in format
        DD/MM/YYYY
      example: 31/03/2023
    Value:
      type: integer
      format: int32
      description: Value in currency of payment request
      example: 1000
    SchemeId:
      type: integer
      format: int32
      description: Unique ID for payment scheme
      example: 1
    Ledger:
      type: string
      description: Target ledger for settlement
      enum:
        - AP
        - AR
      example: AP
    DeliveryBody:
      type: string
      description: Delivery body responsible for payment
      example: RP00
    DebtType:
      type: string
      description: Reason for recovery
      enum:
        - adm
        - irr
    RecoveryDate:
      type: string
      description: Date recovery identified in format DD/MM/YYYY
      example: 31/03/2023
    OriginalSettlementDate:
      type: string
      description: Date original invoice settled
      example: 31/03/2023
    ReferenceId:
      type: string
      format: uuid
      description: Unique reference for payment request to support duplicate detection
      example: 123e4567-e89b-12d3-a456-426655440000
    Pillar:
      type: string
      description: Pillar of scheme for manual invoices
      example: DA
    Description:
      type: string
      description: Description of invoice line
      example: G00 - Gross value of claim
    SchemeCode:
      type: string
      description: Funding option invoice line relates to
      example: '80001'
    FundCode:
      type: string
      description: Fund code to pay invoice line from
      example: DRD10
    AccountCode:
      type: string
      description: Account code to pay invoice line from
      example: SOS710
    Convergence:
      type: boolean
      description: Whether invoice line is convergence
      example: false
    StateAid:
      type: boolean
      description: Whether invoice line is state aid
      example: false
    Success:
      type: boolean
      description: 'Whether request was successfully loaded by DAX, required'
      example: true
    Acknowledged:
      type: string
      format: date-time
      description: Date acknowledged by D365
      example: '2021-01-01T00:00:00Z'
    Message:
      type: string
      description: Extra content for issues
      example: Invalid invoice number
    PostedDate:
      type: string
      format: date-time
      description: Date posted to D365 ledger
      example: 31/03/2023
    Reference:
      type: string
      description: Settlement reference from D365
      example: PY1234567
    Settled:
      type: boolean
      description: Whether request was successfully settled
      example: true
    Detail:
      type: string
      description: Additional settlement information from D365
      example: Settled on 31/03/2023
    Specversion:
      type: string
      description: The version of the CloudEvents specification which the event uses.
      example: '1.0'
    Type:
      type: string
      description: The type of event in reverse DNS notation.
      example: uk.gov.defra.ffc.pay.payment.enriched
    Source:
      type: string
      description: The service publishing the event.
      example: ffc-pay-enrichment
    Id:
      type: string
      format: uuid
      description: The unique ID of the event.
      example: 123e4567-e89b-12d3-a456-426655440000
    Time:
      type: string
      format: date-time
      description: The time the event was published.
      example: '2020-01-01T12:00:00Z'
    Subject:
      type: string
      description: The subject of the event.
      example: Payment request enriched
    Datacontenttype:
      type: string
      description: The content type of the event payload.
      example: text/json
    HoldCategoryId:
      type: integer
      format: int32
      description: Hold category identifier.
      example: 1
    Filename:
      type: string
      description: Name of the file containing the payment requests.
      example: SITISFI0001_AP_20230302192230.dat
